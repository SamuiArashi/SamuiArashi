<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 210" width="880" height="210" role="img" aria-label="Samui - .NET 8 APIs on the back, React and Next.js on the front">
  <title>Samui</title>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="55%" stop-color="#a371f7"/>
      <stop offset="100%" stop-color="#a371f7" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.88" cy="0.05" r="0.75">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.3" fill="#30363d"/>
    </pattern>
    <clipPath id="card"><rect width="880" height="210" rx="14"/></clipPath>
  </defs>
  <style>
    .f { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .m { font-family: ui-monospace, SFMono-Regular, "Cascadia Code", "Fira Code", Consolas, monospace; }
    .r { opacity: 0; animation: rise .65s cubic-bezier(.2,.7,.3,1) forwards; }
    .d1 { animation-delay: .04s } .d2 { animation-delay: .16s }
    .d3 { animation-delay: .34s } .d4 { animation-delay: .46s }
    @keyframes rise { from { opacity: 0; transform: translateY(9px) } to { opacity: 1; transform: none } }
    .line { transform-box: fill-box; transform-origin: left center; animation: grow .75s .26s cubic-bezier(.2,.7,.3,1) both; }
    @keyframes grow { from { transform: scaleX(0) } to { transform: scaleX(1) } }
    @media (prefers-reduced-motion: reduce) {
      .r, .line { animation: none; opacity: 1; transform: none }
    }
  </style>
  <g clip-path="url(#card)">
    <rect width="880" height="210" fill="#0d1117"/>
    <rect width="880" height="210" fill="url(#dots)" opacity="0.55"/>
    <rect width="880" height="210" fill="url(#glow)"/>
  </g>
  <rect x="0.5" y="0.5" width="879" height="209" rx="14" fill="none" stroke="#30363d"/>
  <text class="m r d1" x="44" y="54" font-size="13" letter-spacing="1.2" fill="#7d8590">@SamuiArashi</text>
  <text class="f r d2" x="44" y="107" font-size="48" font-weight="700" letter-spacing="-1.2" fill="#e6edf3">Samui</text>
  <rect class="line" x="44" y="123" width="128" height="3" rx="1.5" fill="url(#accent)"/>
  <text class="f r d3" x="44" y="159" font-size="16.5" fill="#c9d1d9">.NET 8 APIs on the back, React and Next.js on the front.</text>
  <text class="m r d4" x="44" y="186" font-size="12.5" letter-spacing="0.3" fill="#6e7681">C#  ·  ASP.NET Core  ·  EF Core  ·  TypeScript  ·  Next.js  ·  Tailwind  ·  Cloudflare Workers</text>
</svg>
